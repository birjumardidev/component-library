<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code-forge</title>
   
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/style.css" />
<script src="
https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js
"></script>
<link href="
https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism.min.css
" rel="stylesheet">
</head>
  <body class="bg-midnight w-full h-screen text-white hover:[&_button]:cursor-pointer">
    <header
      class="bg-glassy-box w-full h-16 px-5 md:px-[5%] border-b border-slate-text fixed top-0"
    >
      <nav class="w-full h-full flex justify-center gap-[5%] items-center">
        <div class="text-mint text-3xl font-bold">SyntaxShell</div>
        <div></div>

        <!-- header nav for big screen -->
        <div class="hidden text-gray-200 text-xl md:flex w-3/5">
          <i class="fa-brands fa-sistrix bg-gray-300 text-gray-700 p-2 rounded-l-xl "></i>
          <input type="search" placeholder="Search components..." class="w-full h-10 bg-gray-300 rounded-r-xl text-gray-700 pl-5 outline-0">
        </div>

      <div class="hidden md:flex gap-[1.5vw] ">
           <div></div>
           <div></div>
         <div class="h-full flex items-center gap-[1vw]">
                  <span class=" hidden md:flex h-10 w-10 bg-amber-300 rounded-4xl items-center justify-center text-black text-lg">BM</span>
                 
         </div>
      </div>

        <!-- mobile right nav -->
        <div class="text-slate-text text-2xl flex gap-3 md:hidden">
          <div id="search-box" class="flex items-center">
            <button id="search-button"><i class="fa-brands fa-sistrix"></i></button>
          </div>
          <button><i class="fa-solid fa-bars"></i></button>
        </div>
      </nav>
    </header>

    <main class="w-full h-full px-40">
          <div class="w-full h-50 py-25">
                  <div id="component-title" class="text-5xl font-semibold text-center text-mint">Vertical Video Scrollar</div>
          </div>
          <div class="w-full h-120 flex gap-4">
                 <div class="w-125 h-full p-5 bg-glassy-box rounded-xl border border-slate-text shrink-0">
                     <div id="component-area" class="bg-gray-200 w-full h-full rounded-lg"></div>
                 </div>


                 <div class="w-180 h-full bg-glassy-box rounded-xl flex flex-col border border-slate-text shrink-0">
                    <div class="p-3 text-lg flex justify-between items-center">
                        <span>HTML + Tailwind CSS</span>
                        <button class="bg-mint text-gray-700 rounded-md px-2 py-1 text-base font-semibold">COPY CODE</button>
                    </div>
                    <div id="code-container" class="bg-[#151D2A] w-full h-full p-4 rounded-b-xl text-white overflow-auto">
                    
                 </div>
          </div>
    </main>

    <script type="module" src="/src/component.js"></script>
<script src="https://cloudflare.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/prism.min.js" integrity="sha512-UOoJElONeUNzQbbKQbjldDf9MwOHqxNz49NNJJ1d90yp+X9edsHyJoAs6O4K19CZGaIdjI5ohK+O2y5lBTW6uQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
