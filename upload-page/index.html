<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code-forge</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
  <body class="bg-midnight w-full h-screen text-white hover:[&_button]:cursor-pointer">
    <header
      class="bg-glassy-box w-full h-16 px-5 md:px-[5%] border-b border-slate-text fixed top-0"
    >
      <nav class="w-full h-full flex justify-center gap-[5%] items-center">
        <div class="text-mint text-3xl font-bold">SyntaxShell</div>
        <div></div>

        <!-- header nav for big screen -->
        <div class="hidden text-gray-200 text-xl md:flex w-3/5">
          <i class="fa-brands fa-sistrix bg-gray-300 text-gray-700 p-2 rounded-l-xl "></i>
          <input type="search" placeholder="Search components..." class="w-full h-10 bg-gray-300 rounded-r-xl text-gray-700 pl-5 outline-0">
        </div>

      <div class="hidden md:flex gap-[1.5vw] ">
           <div></div>
           <div></div>
         <div class="h-full flex items-center gap-[1vw]">
                  <span class=" hidden md:flex h-10 w-10 bg-amber-300 rounded-4xl items-center justify-center text-black text-lg">BM</span>
                  
         </div>
      </div>

        <!-- mobile right nav -->
        <div class="text-slate-text text-2xl flex gap-3 md:hidden">
          <div id="search-box" class="flex items-center">
            <button id="search-button"><i class="fa-brands fa-sistrix"></i></button>
          </div>
          <button><i class="fa-solid fa-bars"></i></button>
        </div>
      </nav>
    </header>
    

   <main class="px-50 pt-25">
       <div class="w-full h-105">
                
             <div class="text-center text-mint text-5xl font-semibold">PUBLISH NEW UI COMPONENT</div>
             <div class="bg-glassy-box w-full h-full rounded-t-md mt-8 p-5">
                <div class="text-2xl font-semibold">UPLOAD & DEFINE COMPONENT</div>
                <div class="flex gap-5 mt-2">
                    <div class="w-full">
                           <div>
                              <div>PASTE CODE</div>
                           </div>
                           <div>
                               <textarea name="paste-code" id="component-code" class="border border-dashed w-full h-80 rounded-lg bg-white/5"></textarea>
                           </div>
                    </div>
                    <div class="w-full flex flex-col gap-4 [&_input]:border-slate-text [&_input]:bg-[#363e47]">
                           <div>
                                <div>COMPONENT TITLE</div>
                                <input id="component-title" type="text" placeholder="Vertical Video Scrollar" class="w-full border rounded-md h-10 pl-2" required>
                           </div>
                           <div>
                             <div>CATEGORY</div>
                                <select id="component-category" type="text" placeholder="Media" class="w-full border border-slate-text rounded-md h-10 pl-2 bg-[#363e47]">
                                  <option value="media">Media</option>
                                  <option value="forms">Forms</option>
                                  <option value="sharts">Charts</option>
                                  <option value="navigation">Navigation</option>
                                  </select>
                           </div>
                           <div>
                             <div>DESCRIPTION</div>
                                <textarea name="" id="component-description" placeholder="A library of modern, resuable somponents built with Html, Tailwind CSS v4 and JavaScript" class="w-full border p-2 border-slate-text bg-[#363e47]  rounded-md h-40"></textarea>
                           </div>
                    </div>
                </div>


             </div> 
            <div class="flex gap-4 items-center justify-end bg-[#363e47] w-full h-16 p-5 rounded-b-md border-t border-slate-text  [&_button]:px-4 [&_button]:p-2 [&_button]:rounded-md">

                <button id="cancle-button" class="border border-green-400 text-mint font-semibold hover:bg-green-400 hover:text-black">CANCLE</button>
                <button id="publish-button" class="bg-green-400 text-black hover:scale-105 active:scale-95">PUBLISH COMPONENT</button>
                </div>


       </div>


   </main>


    <script type="module" src="/src/upload.js"></script>
</body>
</html>
